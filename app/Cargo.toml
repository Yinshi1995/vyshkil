[package]
name = "app"
version = "0.1.0"
edition = "2021"

# cdylib потрібен лише кінцевому wasm-бінарнику (крейт frontend), але лишаємо його і тут,
# бо workspace-конвенція Leptos будує app як спільну lib для обох таргетів (ssr/hydrate).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
# Раніше лише сервер ((де)серіалізація submission.draft_payload jsonb) -- тепер завжди
# (не optional): pages/admin_whatsapp/mod.rs парсить SSE-повідомлення на клієнті (wasm), сам
# serde_json компілюється під wasm32 так само, як chrono вище -- обмеження було штучним.
serde_json = "1"
# Парсинг/арифметика дат у domain/dates.rs (02 §4, 03 §4) -- чиста дата-математика, без "clock"
# (не читаємо системний час) і без "wasmbind" (не чіпаємо JS Date) -- компілюється в WASM так само,
# як і на сервері (рішення: [[chrono-in-domain]]).
chrono = { version = "0.4", default-features = false, features = ["std"] }
# sea-orm потрібен лише на боці сервера (щоб #[server]-функція могла дістати DatabaseConnection
# з контексту, а `queries` — самостійно з'єднатись у тестах) — опційний, вмикається тільки під
# feature "ssr", у wasm його бути не може. Драйвер+рантайм (не лише "macros") потрібні, щоб
# `app::queries` міг підключатись до Postgres напряму в інтеграційних тестах, без сервера/Leptos-контексту.
sea-orm = { version = "1", default-features = false, features = [
    "macros",
    "sqlx-postgres",
    "runtime-tokio-rustls",
], optional = true }
# Типи/каст подій і елементів DOM для керування сіткою з клавіатури (Етап 4, pages/training_form).
# НЕ під feature "hydrate": ці типи потрібні й при звичайній (ssr) збірці компонента -- Leptos
# рендерить те саме дерево view! і на сервері (розмітка), просто без реального DOM/подій; самі
# типи компілюються на будь-якому таргеті (структурні визначення wasm-bindgen), функціонують лише
# в WASM. leptos і так тягне обидва крейти транзитивно завжди -- тут лише називаємо типи явно.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlElement", "KeyboardEvent", "File", "FileList", "DragEvent", "DataTransfer", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Window", "DomRect", "FocusOptions", "Storage", "EventSource", "EventSourceInit", "MessageEvent"] }
# Читання байтів обраного файлу (Етап 5, `pages/import`) -- `File::array_buffer()` повертає
# JS Promise, потрібен `wasm_bindgen_futures::JsFuture` щоб await-нути його з Rust; `js_sys` --
# для Uint8Array/зняття байтів із ArrayBuffer. Той самий принцип, що й wasm-bindgen/web-sys вище
# ([[wasm-bindgen-in-pages]]): типи компілюються на будь-якому таргеті, функціонують лише в WASM.
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# xlsx-екстрактор (Етап 5, 03 §2) -- лише сервер: розбір файлу відбувається в server fn.
calamine = { version = "0.36", features = ["chrono"], optional = true }
# xlsx-генератор документів (Етап 7, 05 §D1/D2) -- лише сервер: формули/об'єднання/freeze panes
# (рекомендація самої 05-спеки); WASM ніколи не генерує документи.
rust_xlsxwriter = { version = "0.79", optional = true }
# Брокер (09-messaging.md, Фаза 1) -- типи повідомлень (`contracts`, wasm-безпечний сам по собі)
# і генерація `outbox.id`/`Envelope.id` (`uuid` v7) потрібні лише в `backend::repo` (ssr):
# домен пише подію в ТІЙ САМІЙ транзакції, що дані, WASM ніколи не публікує напряму.
contracts = { path = "../contracts", optional = true }
uuid = { version = "1", features = ["v7"], optional = true }
# Адмін-сторінка /admin/whatsapp (09 §4) -- request-reply команди до notifier'а через NATS.
bus = { path = "../bus", optional = true }
# Адмін-сторінка /admin/queues (09 §5, Фаза 4) -- (де)кодування payload DLQ-записів.
base64 = { version = "0.23", optional = true }
# Стильова система (Фаза 2, docs/spec/08-style-system.md) -- style без рантайм-залежностей
# (компілюється в wasm так само, як на сервері); style_macros -- proc-macro, компілюється
# для host незалежно від таргету консюмера.
style = { path = "../style" }
style_macros = { path = "../style_macros" }

[dev-dependencies]
# Тільки для інтеграційних тестів `queries` (окрема тестова БД, "Як вести розробку далі" §3) —
# не тягнеться у wasm, бо dev-dependencies не впливають на звичайну (не тестову) збірку.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
migration = { path = "../migration" }
# Лише тест app/tests/import_fah.rs: розпаковує тестову фікстуру "17 АК 6 додатків.zip"
# (source_files/, ДСК) -- сам продукт zip не читає, користувач завантажує окремі xlsx.
# Ім'я файлу в zip у CP866 (не UTF-8/CP437) -- розпаковуємо за позицією запису, не за іменем.
zip = "8"

[features]
hydrate = ["leptos/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:sea-orm",
    "dep:calamine",
    "dep:rust_xlsxwriter",
    "dep:contracts",
    "dep:uuid",
    "dep:bus",
    "dep:base64",
]
