[workspace]
resolver = "2"
members = ["app", "frontend", "server", "migration"]

# Єдине місце версій для крейтів Leptos: app/frontend/server завжди компілюються
# проти однакової версії, інакше SSR-рендер і WASM-гідратація можуть розійтися
# в серіалізації view-дерева і впасти з незрозумілою помилкою на клієнті.
[workspace.dependencies]
leptos = { version = "0.7" }
leptos_axum = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7" }
serde = { version = "1", features = ["derive"] }

# Профіль для продакшен-збірки на слабкому сервері: тут свідомо жертвуємо
# часом компіляції та піковою продуктивністю заради меншого бінарника й нижчого RSS.
[profile.release]
opt-level = "z"     # оптимізація під розмір коду, а не швидкість — на слабкому сервері диск/пам'ять дорожчі за CPU-цикли
lto = true          # link-time optimization бачить весь граф викликів між крейтами і вирізає мертвий код наскрізь
codegen-units = 1   # один кодоген-юніт дає оптимізатору повну картину програми ціною довшої (але одноразової) збірки
panic = "abort"     # без розкрутки стека не потрібні таблиці unwind-лендінгів — менший бінарник і трохи швидший panic-шлях
strip = true        # прибираємо debug-символи з релізного бінарника — найдешевший спосіб зменшити розмір артефакту

# Конфігурація cargo-leptos: тримаємо server і frontend окремими бінарним/бібліотечним
# пакетами, щоб SSR-бінарник ніколи не тягнув за собою wasm-bindgen-залежності фронтенду.
[[workspace.metadata.leptos]]
name = "taktoblik"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
env = "PROD"
# Темно-оливкова палітра + помаранчевий акцент (05-documents.md), узгоджена з .claude/decisions/ui-visual-style-source.md.
style-file = "app/style/main.css"
