[workspace]
resolver = "2"
members = ["app", "server", "migration", "contracts", "bus"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

# Профіль для продакшен-збірки на слабкому сервері: тут свідомо жертвуємо
# часом компіляції та піковою продуктивністю заради меншого бінарника й нижчого RSS.
# Залежності в dev-профілі оптимізуємо (opt-level=2) — вони рідко перезбираються;
# workspace-крейти лишаються на opt-level=0 для швидкого ребілду.
[profile.dev]
debug = "line-tables-only"  # швидший лінк і менший target/ на ноутбуці

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2      # ревізія 2 (2026-11-02, .claude/decisions/release-profile-size.md): швидкість збірки й роботи важливіша за розмір бінарника
lto = "thin"       # thin LTO: майже той самий виграш, але паралелиться й не з'їдає всю RAM на 2-ГБ сервері
codegen-units = 16 # паралельний кодоген — збірка в рази швидша, ноутбук і прод-VM не стоять на одному ядрі
panic = "abort"    # без розкрутки стека — менший бінарник і швидший panic-шлях
strip = true       # без debug-символів у релізі
