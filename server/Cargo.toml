[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
app = { path = "../app", features = ["ssr"] }
migration = { path = "../migration" }
# Relay (09-messaging.md §3.1, Фаза 1) -- publish непублікованих рядків outbox у NATS.
bus = { path = "../bus" }
contracts = { path = "../contracts" }
# admin_sse.rs -- /admin/whatsapp SSE (09 §4), не Leptos #[server] fn (ті не стрімлять).
async-stream = "0.3"
futures = "0.3"
# Рендер QR у SVG на сервері (не client-side JS з CDN -- CLAUDE.md: "жодних мережевих викликів
# ... локально", той самий принцип, що self-hosted шрифти).
qrcode = "0.14"
serde_json = "1"
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_xlsxwriter = "0.79"
urlencoding = "2"
# "macros" вмикає #[derive(FromRef)] для AppState (axum::extract::FromRef інакше є лише трейтом, без derive).
axum = { version = "0.7", features = ["macros", "multipart"] }
leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# oneshot (для ServeDir у fallback-хендлері) живе саме в tower, не в tower-http.
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip", "trace"] }
sea-orm = { version = "1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
serde = { workspace = true }
# default-features = false: вимикаємо статистику використання секцій mimalloc, яка на віддалених
# ОС не завжди коректно білдиться і нам тут не потрібна — лишаємо тільки сам аллокатор.
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# tests/relay.rs: TEST_DATABASE_URL/TEST_NATS_URL-гейтований інтеграційний тест (09 §6).
uuid = { version = "1", features = ["v7"] }
contracts = { path = "../contracts" }
async-nats = "0.38"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
serde = { workspace = true }
serde_json = "1"
