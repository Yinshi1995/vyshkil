# Два "хости":
# - `localhost`: Proxmox API (provision-prod-vm.yml) — без SSH до гіпервізора.
# - `prod-vm`: сама VM, конфігурується по SSH після створення.
all:
  children:
    proxmox_api:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    prod:
      hosts:
        prod-vm:
          # ЗАПОВНИТИ: IP на VyOS-керованому сегменті (не vmbr0).
          ansible_host: "{{ prod_vm_ip | default('ЗАПОВНИТИ') }}"
          ansible_user: "{{ prod_vm_user }}"
          ansible_ssh_private_key_file: "{{ prod_vm_ssh_key_path | default('/root/.ssh/vyshkil-prod') }}"
          ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
