# Два "хости":
# - `localhost`: Proxmox API (provision-prod-vm.yml) — без SSH до гіпервізора.
# - `prod-vm`: сама VM, конфігурується по SSH після створення.
all:
  children:
    proxmox_api:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    prod:
      hosts:
        prod-vm:
          # VLAN 90 за VyOS (11 §0.3) — з LAN маршруту нема, SSH через VyOS як jump-host.
          ansible_host: 10.90.0.10
          ansible_user: "{{ prod_vm_user }}"
          ansible_ssh_private_key_file: "{{ prod_vm_ssh_key_path | default('/root/.ssh/vyshkil-prod') }}"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=accept-new
            -o ProxyCommand="ssh -i /root/.ssh/vyshkil-prod -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -W %h:%p vyos@192.168.1.2"
