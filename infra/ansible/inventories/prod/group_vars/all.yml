# Прод-параметри. Секрети — group_vars/vault.yml (шаблон — vault.yml.example).

# --- Proxmox (provision VM) ---
pve_node: pidhotovka
pve_api_host: "{{ pve_api_host_override | default('192.168.1.106') }}"
pve_api_user: root@pam
pve_template_vmid: 9000
pve_template_name: ubuntu-24.04-cloudimg
pve_prod_vmid: 400
pve_prod_vm_name: vyshkil-prod
pve_storage_images: local-lvm
pve_storage_templates: local
cloud_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img

# --- Розмір прод-VM (менше dev: нема компіляції, лише Docker runtime) ---
prod_vm_cores: 2
prod_vm_cpu_type: host
prod_vm_memory_mb: 2048
prod_vm_swap_gb: 2
prod_vm_disk_gb: 50

# --- Мережа: VLAN 90 `VYSHKIL` за VyOS (11 §0.3) ---
# vmbr10 — VLAN-aware trunk до VyOS eth1; vif 90 = 10.90.0.1. DHCP на VyOS немає — статика.
prod_vm_bridge: vmbr10
prod_vm_vlan_tag: 90
prod_vm_ip_cidr: "10.90.0.10/24"
prod_vm_gateway: "10.90.0.1"
# VyOS сам DNS не обслуговує — pihole (INFRA 60), дозволено VyOS rule 50 для SRV-NETS.
prod_vm_dns: "10.60.0.53"
# cf-connector (LXC 150, EDGE VLAN 10) — єдине джерело, якому відкрито :3000 (11 §0.2).
prod_cf_connector_ip: "10.10.0.5"

# --- Користувач ---
prod_vm_user: deploy
prod_vm_ip: "{{ prod_vm_ip_cidr | regex_replace('/.*', '') }}"
prod_vm_ssh_key_path: /root/.ssh/vyshkil-prod
# Публічні ключі — не секрет (як у dev). Особистий ключ замовника + ключ автоматизації без пароля.
prod_vm_user_ssh_public_key: |
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILnSkk/si0+4Z5UNniaDb44wy8ZnplfYR5RHJ/4kUrGq pidhotova
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOCHjl2GhneXG2b9IHKKzAZ6VlkyXO7SfnP4OdNsaoSq claude-code@vyshkil-prod-automation

# --- Base role overrides (прод-режим) ---
base_primary_user: "{{ prod_vm_user }}"
base_user_passwordless_sudo: false
base_swap_gb: "{{ prod_vm_swap_gb }}"

# --- Docker role overrides ---
docker_add_primary_user_to_group: false
docker_dns_servers:
  - "{{ prod_vm_dns }}"

# --- Firewall ---
firewall_allowed_tcp_ports:
  - 22
firewall_published_ports:
  # Публічного домену (Cloudflare → cf-connector) більше немає: Вишкіл лише через тунель і вхід ІКС.
  # NetBird-шлюз (VM 195): адмінки через тунель, vyshkil.lab.okpivden.uk
  - port: 3000
    source: 10.60.0.30
  # Проксі *.lab в окремому VLAN (CT 161 lab-proxy, docs/LAB-EDGE.md у репо pult)
  - port: 3000
    source: 10.61.0.10
  # Пульт (VM 190): агент і cAdvisor
  - port: 9440
    source: 10.70.0.40
  - port: 8081
    source: 10.70.0.40
# Пульт: node_exporter (network_mode host)
firewall_allowed_tcp_from:
  - port: 9100
    source: 10.70.0.40

# --- App stack ---
app_stack_compose_dir: "/opt/vyshkil"
app_stack_data_dir: "/opt/vyshkil/data"
app_stack_images_dir: "/opt/vyshkil/images"
app_stack_app_bind_addr: "{{ prod_vm_ip }}"

# --- Вхід через ІКС: застосунку — вузький вихід лише на Pocket ID (проксі *.lab, 10.60.0.30:443) ---
app_stack_iks_subnet: 172.31.90.0/24
firewall_iks_egress:
  subnet: 172.31.90.0/24
  # Старий (VM 195) і новий (CT 161, адреса входу ІКС) проксі *.lab — на час переїзду обидва
  dest: "{ 10.60.0.30, 10.61.0.40 }"
  port: 443
