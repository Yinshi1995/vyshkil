# Два "хости" в цьому інвентарі мають геть різну природу:
# - `localhost`: звідси виконуються задачі community.proxmox (API-токен, HTTPS до :8006) — немає
#   SSH-з'єднання до самого гіпервізора (замовник навмисно тримає його чистим, `[[iac-ansible]]`).
# - `dev-vm`: сама VM 300, конфігурується по SSH після того, як `provision-dev-vm.yml` її створить.
#   ansible_host — DHCP-адреса (vmbr0, та сама LAN, що й Windows-хост розробки,
#   `[[dev-vm-parameters]]`). IP невідомий до Фази 2 — ЗАПОВНИТИ тут вручну (або qemu-guest-agent
#   IP) одразу після першого запуску VM, перед прогоном dev-vm.yml.
all:
  children:
    proxmox_api:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    dev:
      hosts:
        dev-vm:
          # Статична IP (10 §1.7 — не DHCP, `[[dev-vm-parameters]]`: DHCP на vmbr0 не видає
          # оренду для нових MAC, перевірено емпірично — cloud-init стабільно зависав на
          # мережевій стадії, зі статикою SSH піднімається за ~14с).
          ansible_host: 192.168.1.200
          ansible_user: dev
          ansible_ssh_private_key_file: /root/.ssh/vyshkil-dev
          ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
