---
# Параметризовано для 11-prod-deploy.md (11 §3: вхідні 443+22, DOCKER-USER-ланцюжок) —
# dev-VM за замовчуванням: лише SSH, без VyOS-сегментації (`[[dev-vm-parameters]]`: та сама
# LAN, що й Windows-хост, тому немає сенсу обмежувати джерело SSH на рівні гостьового nftables —
# уся LAN і так однаково довірена, як і зараз для Windows-машини розробки).
firewall_allowed_tcp_ports:
  - 22
# Docker-порти, опубліковані не на 127.0.0.1: [{port: 3000, source: 10.10.0.5}] (прод, 11 §3.1).
# Порожньо (dev) — forward-ланцюжок без змін.
firewall_published_ports: []
# Порти хоста лише з конкретної адреси: [{port: 9100, source: 10.70.0.40}] (node_exporter для Пульта).
firewall_allowed_tcp_from: []
firewall_external_iface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
