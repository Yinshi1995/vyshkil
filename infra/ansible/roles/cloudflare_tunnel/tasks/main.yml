---
- name: Додати GPG-ключ Cloudflare
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: Додати apt-репо Cloudflare
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main"
    filename: cloudflared
    state: present

- name: Встановити cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true

- name: "Системний користувач {{ cloudflare_tunnel_user }}"
  ansible.builtin.user:
    name: "{{ cloudflare_tunnel_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: "Каталог конфігурації {{ cloudflare_tunnel_config_dir }}"
  ansible.builtin.file:
    path: "{{ cloudflare_tunnel_config_dir }}"
    state: directory
    owner: "{{ cloudflare_tunnel_user }}"
    group: "{{ cloudflare_tunnel_user }}"
    mode: "0750"

- name: Systemd unit для cloudflared tunnel
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустити cloudflared

- name: Увімкнути й запустити cloudflared
  ansible.builtin.systemd:
    name: cloudflared
    daemon_reload: true
    enabled: true
    state: started
