---
app_stack_compose_dir: /opt/vyshkil
app_stack_data_dir: "{{ app_stack_compose_dir }}/data"
app_stack_images_dir: "{{ app_stack_compose_dir }}/images"
# Адреса публікації :3000. Прод — IP VM (cf-connector ходить через VyOS, 11 §0.2), інакше loopback.
app_stack_app_bind_addr: 127.0.0.1
app_stack_user: "{{ base_primary_user | default('deploy') }}"

# Postgres
app_stack_postgres_app_db: taktoblik
app_stack_postgres_app_user: taktoblik
app_stack_postgres_notifier_db: notifier
app_stack_postgres_notifier_user: notifier

# NATS
app_stack_nats_app_user: app
app_stack_nats_notifier_user: notifier

# Вхід через ІКС (OIDC, 12-auth.md §2.5). Секрет — vault_oidc_client_secret у vault; без нього
# OIDC_CLIENT_SECRET порожній → вхід через ІКС вимкнено (застосунок стартує як завжди).
app_stack_oidc_issuer: https://id.lab.okpivden.uk
app_stack_oidc_client_id: vyshkil
app_stack_oidc_redirect_uri: https://vyshkil.lab.okpivden.uk/api/auth/oidc/callback
app_stack_oidc_group: vyshkil
# Аварійний вхід за паролем: "1" — увімкнено. Штатно вимкнено.
app_stack_password_login: "0"
# Мережа app → ІКС (порожньо — без неї, app лишається повністю ізольованим). Хост і адреса
# проксі *.lab, на якому живе Pocket ID; firewall пускає з цієї мережі лише туди й лише 443.
app_stack_iks_subnet: ""
app_stack_oidc_host: id.lab.okpivden.uk
app_stack_iks_proxy_ip: 10.60.0.30
