---
# Node {{ node_major_version }} LTS для services/notifier (CLAUDE.md сервісу: "Node 22 LTS, не
# Bun — перевірено емпірично"). Репозиторій NodeSource, без npm-пакетів глобально ("без
# глобального мотлоху" — 10 §4.3): цей крок ставить лише сам рантайм.
- name: python3-debian (потрібен deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: "Репозиторій NodeSource ({{ node_major_version }}.x, deb822)"
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

- name: Встановити nodejs
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Перевірка версії
  ansible.builtin.command: node --version
  register: node_version_check
  changed_when: false
  failed_when: not node_version_check.stdout.startswith('v' + node_major_version | string)
