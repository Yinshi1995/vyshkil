---
# Pull-автодеплой на прод-VM (11 §5.1): образи збирає GitHub Actions у GHCR, таймер тут їх
# підтягує. Ні dev-VM, ні ноут розробника в ланцюжку не потрібні.

- name: Скрипт деплою
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/deploy-prod.sh"
    dest: "{{ prod_autodeploy_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Каталог стану
  ansible.builtin.file:
    path: "{{ prod_autodeploy_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: systemd-юніти автодеплою
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vyshkil-prod-deploy.service
    - vyshkil-prod-deploy.timer

- name: Таймер автодеплою
  ansible.builtin.systemd:
    name: vyshkil-prod-deploy.timer
    daemon_reload: true
    enabled: "{{ prod_autodeploy_enabled }}"
    state: "{{ 'started' if prod_autodeploy_enabled else 'stopped' }}"
