---
# Офіційний репозиторій Docker (10 §4.2) — не snap, щоб docker compose v2-плагін і версії
# відповідали тому, що вже перевірено в docker-compose.yml репозиторію.
- name: Залежності для репозиторію Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present

- name: Репозиторій Docker (deb822 — apt_repository застарів, прибирається в ansible-core 2.25)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repo

- name: Встановити Docker Engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: "daemon.json — лог-ротація, live-restore, явний DNS (10 §4.2)"
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "local",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        },
        "live-restore": true,
        "dns": {{ docker_dns_servers | to_json }}
      }
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустити docker

- name: Увімкнути й запустити docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: "{{ base_primary_user }} у групі docker"
  ansible.builtin.user:
    name: "{{ base_primary_user }}"
    groups: docker
    append: true
  when: docker_add_primary_user_to_group

- name: Перевірка — docker info від root (чи піднявся демон)
  ansible.builtin.command: docker info
  register: docker_info_check
  changed_when: false
