# Збірка образів для проду (docs/spec/11-prod-deploy.md §5.1, .claude/decisions/prod-autodeploy-pull.md).
# Пуш у main → образи в GHCR з тегом <sha>, потім обидва атомарно отримують тег :main.
# Прод-VM сама (таймер) бачить новий :main і оновлюється — GitHub нічого не знає про інфраструктуру.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/yinshi1995

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: vyshkil-app
            context: .
          - name: vyshkil-notifier
            context: services/notifier
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # :main переставляється лише коли ОБИДВА образи готові — прод не побачить півреліз.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Тег :main
        run: |
          for n in vyshkil-app vyshkil-notifier; do
            docker buildx imagetools create -t "$REGISTRY/$n:main" "$REGISTRY/$n:${{ github.sha }}"
          done
