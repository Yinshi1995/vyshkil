# NATS auth (09-messaging.md §3.6, Фаза 3, .claude/decisions/broker-nats-jetstream.md).
# Один глобальний account, права per-user (не окремі accounts + export/import -- простіше для
# одного сервера, subject-и лишаються в одному просторі імен). Паролі тут -- dev-значення
# (той самий підхід, що docker-compose.yml's POSTGRES_PASSWORD=taktoblik), для реального
# розгортання замінити на справжні секрети через env/secrets механізм хоста.

jetstream {
  store_dir: /data
}

authorization {
  users: [
    {
      user: app
      password: app-dev-password
      permissions: {
        # app (relay) публікує доменні події + команди адмінці WhatsApp; $JS.API.> потрібен,
        # щоб relay сам забезпечував (get-or-create) стрім EVENTS на старті. "notify.send.>" --
        # ще не має реального продюсера (доменна логіка "кого сповіщати" відкладена, 04 §5 /
        # MEMORY.md), але §3.6 спеки вже покладає цей subject на app (майбутній outbox-продюсер
        # NotifySend) -- права готові наперед, код підʼєднається пізніше.
        publish: {
          allow: ["vyshkil.discrepancy.>", "vyshkil.notify.send.>", "vyshkil.notifier.whatsapp.>", "$JS.API.>"]
        }
        # Відповіді на request-reply (_INBOX.>) + результати доставки нотифікатора.
        subscribe: { allow: ["vyshkil.notify.result.>", "_INBOX.>", "$JS.API.>"] }
      }
    }
    {
      user: notifier
      password: notifier-dev-password
      permissions: {
        publish: { allow: ["vyshkil.notify.result.>", "vyshkil.dlq.notify.>", "$JS.API.>"] }
        subscribe: {
          allow: ["vyshkil.notify.send.>", "vyshkil.notifier.whatsapp.>", "_INBOX.>", "$JS.API.>"]
        }
      }
    }
  ]
}
